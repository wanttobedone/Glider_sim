#!/usr/bin/env python
PACKAGE = "ug_control"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
# 参数分别为默认/最小/最大
gen.add("dive_depth",        double_t, 0, "Zigzag max dive depth [m]",   30.0, 1.0, 200.0)
gen.add("climb_depth",       double_t, 0, "Zigzag min climb depth [m]",  2.0,  0.5, 50.0)
gen.add("acceptance_radius", double_t, 0, "Waypoint acceptance [m]",     5.0, 5.0, 200.0)
gen.add("depth_threshold",   double_t, 0, "Depth switch threshold [m]",  1.0,  0.1, 5.0)
gen.add("target_depth",      double_t, 0, "Direct depth cmd [m] (IDLE mode)", 0.0, 0.0, 200.0)
gen.add("cancel_mission",    bool_t,   0, "Cancel current mission",      False)

exit(gen.generate(PACKAGE, "mission_node", "Mission"))
